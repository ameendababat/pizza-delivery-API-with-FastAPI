<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f1a">
  <title>Pizza Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Floating Background Emojis -->
  <div class="floating-emojis">
    <span class="floating-emoji">🍕</span>
    <span class="floating-emoji">🧀</span>
    <span class="floating-emoji">🍅</span>
    <span class="floating-emoji">🫒</span>
    <span class="floating-emoji">🌿</span>
    <span class="floating-emoji">🔥</span>
    <span class="floating-emoji">🍕</span>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="hidden">
    <div class="loading-content">
      <div class="spinner spinner-lg"></div>
      <p style="color: var(--text-muted)">Loading...</p>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="toast-container"></div>

  <div id="app">
    <!-- Auth Section -->
    <div id="auth-section" class="section">
      <div class="auth-container">
        <div class="auth-tabs">
          <button class="tab active" data-tab="login">Login</button>
          <button class="tab" data-tab="signup">Sign Up</button>
        </div>

        <form id="login-form" class="auth-form active">
          <h2>Welcome Back</h2>
          <div class="input-group">
            <span class="input-icon">👤</span>
            <input type="text" id="login-username" placeholder="Username" required autocomplete="username">
          </div>
          <div class="input-group">
            <span class="input-icon">🔑</span>
            <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary">Login</button>
          <p id="login-error" class="error-msg"></p>
        </form>

        <form id="signup-form" class="auth-form">
          <h2>Create Account</h2>
          <div class="input-group">
            <span class="input-icon">👤</span>
            <input type="text" id="signup-username" placeholder="Username" required autocomplete="username">
          </div>
          <div class="input-group">
            <span class="input-icon">📧</span>
            <input type="email" id="signup-email" placeholder="Email" required autocomplete="email">
          </div>
          <div class="input-group">
            <span class="input-icon">🔑</span>
            <input type="password" id="signup-password" placeholder="Password" required autocomplete="new-password">
          </div>
          <label class="checkbox-label">
            <input type="checkbox" id="signup-staff"> Staff account
          </label>
          <button type="submit" class="btn btn-primary">Sign Up</button>
          <p id="signup-error" class="error-msg"></p>
        </form>
      </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="section hidden">
      <header>
        <h1>🍕 Pizza Delivery</h1>
        <div class="header-info">
          <span id="user-badge"></span>
          <button id="logout-btn">Logout</button>
        </div>
      </header>

      <nav>
        <button class="nav-btn active" data-view="my-orders">📋 My Orders</button>
        <button class="nav-btn" data-view="new-order">➕ New Order</button>
        <button id="admin-btn" class="nav-btn hidden" data-view="admin">⚙️ Admin</button>
      </nav>

      <main>
        <!-- My Orders View -->
        <div id="view-my-orders" class="view active">
          <h2>📋 My Orders</h2>
          <div id="orders-list">
            <div class="loading-content">
              <div class="spinner"></div>
              <p class="loading">Loading orders...</p>
            </div>
          </div>
        </div>

        <!-- New Order View -->
        <div id="view-new-order" class="view">
          <h2>🍕 Place an Order</h2>
          <div class="order-form-wrapper">
            <form id="order-form">
              <label>Pizza Size</label>
              <div class="input-group">
                <span class="input-icon">📏</span>
                <select id="order-size" required>
                  <option value="SMALL">Small</option>
                  <option value="MEDIUM">Medium</option>
                  <option value="LARGE">Large</option>
                </select>
              </div>
              <label>Quantity</label>
              <div class="input-group">
                <span class="input-icon">🔢</span>
                <input type="number" id="order-quantity" min="1" value="1" required>
              </div>
              <button type="submit" class="btn btn-primary">Place Order</button>
              <p id="order-error" class="error-msg"></p>
              <p id="order-success" class="success-msg"></p>
            </form>
          </div>
        </div>

        <!-- Admin View -->
        <div id="view-admin" class="view">
          <h2>⚙️ All Orders (Admin)</h2>
          <div id="admin-orders-list">
            <div class="loading-content">
              <div class="spinner"></div>
              <p class="loading">Loading all orders...</p>
            </div>
          </div>
        </div>
      </main>

      <footer>
        <p>🍕 Pizza Delivery &middot; Built with ❤️</p>
      </footer>
    </div>
  </div>

  <!-- Order Detail Modal -->
  <div id="order-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h3 id="modal-title">📦 Order Details</h3>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Custom Confirm Modal -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal" id="confirm-close">&times;</span>
      <div class="confirm-icon">⚠️</div>
      <h3 id="confirm-title">Confirm</h3>
      <p id="confirm-message" style="color: var(--text-muted); margin-top: 0.5rem;"></p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" id="confirm-cancel">Cancel</button>
        <button class="btn btn-danger" id="confirm-ok">Confirm</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
